##################
# inputconf
##################

[inputconf-command]
syntax = inputconf (conffile=<string>)? (location=<string>)?
shortdesc = Read and parse Splunk configuration files
description = Read all stanzas in the specified conffile from the specified location \p\\
            and output each key-value pair as a structured result row. \p\\
            \i\\
            * <conffile> — conf filename to read (default: inputs.conf). \i\\
              Supports any .conf file: inputs.conf, transforms.conf, props.conf, \i\\
              outputs.conf, serverclass.conf, authorize.conf, etc. \i\\
            * <location> — where to look for conf files: \i\\
              - deployment-apps (default) — $SPLUNK_HOME/etc/deployment-apps/ \i\\
              - apps — $SPLUNK_HOME/etc/apps/ \i\\
              - master-apps — $SPLUNK_HOME/etc/master-apps/ \i\\
              - system — $SPLUNK_HOME/etc/system/ (local + default) \i\\
              - etc — $SPLUNK_HOME/etc/ (walks everything) \p\\
            Each result row includes: stanza, source (file path), app (extracted \i\\
            from path), _time (file modification time), plus all key=value pairs \i\\
            from that stanza. \p\\
            For serverclass.conf, additional fields are extracted: server_class \i\\
            and deploy_app (parsed from the stanza name hierarchy).
commentcheat = Show contents of all matching conf files.
examplecheat = | inputconf conffile="serverclass.conf" location="system"
examplecheat2 = | inputconf conffile="transforms.conf" location="deployment-apps"
examplecheat3 = | inputconf conffile="inputs.conf" location="apps"
usage = public

